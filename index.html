<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Icon Bench</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<div id="top" class="glass">
 <b>Icon Bench</b>
 <span id="tools">
  <button data-t="view" title="View (H): look around only, nothing can be selected"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button><button data-t="select" class="on" title="Select (V)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3 L19 10 L12 12 L10 19 Z"/></svg></button><button data-t="rotate" title="Rotate (T): drag to turn the selected shape around its center or a pivot point"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button><button data-t="line" title="Line (L)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 L19 5"/></svg></button><button data-t="rect" title="Rect (R)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button><button data-t="circle" title="Circle (C)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button><button data-t="ellipse" title="Ellipse (E)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg></button><button data-t="polyline" title="Polyline (Y)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17 L9 8 L15 14 L21 5"/></svg></button><button data-t="polygon" title="Polygon (G)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 L21 10 L17.5 21 L6.5 21 L3 10 Z"/></svg></button><button data-t="path" title="Path (P)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 C8 4 16 4 20 18"/><circle cx="4" cy="18" r="1.6"/><circle cx="20" cy="18" r="1.6"/></svg></button>
 </span>
 <select id="step" title="Snap to grid"><option value="1">Snap 1</option><option value="0.5">Snap 0.5</option><option value="0.25">Snap 0.25</option><option value="0">Snap off</option></select>
 <button id="undo">Undo</button><button id="redo">Redo</button>
 <span class="zg"><button id="zout" title="Zoom out (-)">&minus;</button><span id="zl">100%</span><button id="zin" title="Zoom in (+)">+</button><button id="zfit" title="Fit (0)">Fit</button></span>
 <span class="sp"></span><span id="pos"></span>
 <button id="save">Save</button><button id="lib">Library</button><button id="import">Import</button><button id="export">Export &#9662;</button>
</div>
<div id="main">
 <div id="left" class="glass"><div class="h">Layers</div><ul id="layers"></ul>
  <div class="btns"><button id="dup">Duplicate</button><button id="up">Raise</button><button id="dn">Lower</button><button id="del">Delete</button></div></div>
 <div id="s1" class="sx"></div>
 <div id="wrap" class="glass"><svg id="stage" xmlns="http://www.w3.org/2000/svg"><g id="grid" pointer-events="none"></g><g id="art"></g><g id="ui"></g></svg></div>
 <div id="s2" class="sx"></div>
 <div id="right" class="glass"><div class="h">Properties</div><div id="insp"></div><div class="h">Preview at 16, 24 and 48 px</div><div id="pv"></div></div>
</div>
<div id="s3" class="sy"></div>
<div id="bot" class="glass"><div class="h"><span>SVG code (edit it here and the canvas follows)</span><span id="msg"></span></div><textarea id="code" spellcheck="false"></textarea></div>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/path-panel.js"></script>
<script src="js/rotate.js"></script>
<script src="js/zip.js"></script>
<script src="js/library.js"></script>
</body></html>
